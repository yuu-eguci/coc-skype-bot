name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t coc-skype-bot:ci .
      - name: Demo (synthetic main.db, no network)
        run: |
          docker run --rm --network none coc-skype-bot:ci demo --seed 1 | tee demo.txt
          grep -q "alice->end You closed the Bot. Bye bye!" demo.txt
      - name: Demo with example events from stdin
        run: |
          docker run --rm -i --network none coc-skype-bot:ci demo --events - --seed 1 \
            < examples/demo-events.txt | tee events.txt
          grep -q "keeper->end You closed the Bot. Bye bye!" events.txt
      - name: Console
        run: |
          printf 'hello\nxxx 1d100\nxxx end\n' \
            | docker run --rm -i --network none coc-skype-bot:ci console --seed 1 | tee console.txt
          grep -q "you->1d100 Result:" console.txt
          grep -q "you->end You closed the Bot. Bye bye!" console.txt
