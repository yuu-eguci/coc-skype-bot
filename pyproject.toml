[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coc-skype-bot"
version = "0.2.0"
description = "Skype Bot for supporting CoC TRPG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.4",
    "watchdog>=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=9",
    "ruff==0.17.6",
    "types-requests",
]

[project.scripts]
coc-skype-bot = "coc_skype_bot.cli:main"

[tool.setuptools]
packages = ["coc_skype_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["media"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["coc_skype_bot"]
